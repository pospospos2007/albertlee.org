<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <rect width="800" height="260" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="798" height="258" rx="15" stroke="#1e293b" stroke-width="2"/>

  <text x="400" y="46" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">ZERO-OPS STATIC PUBLISHING PIPELINE ($0 / MONTH)</text>

  <!-- Step 1: Markdown -->
  <rect x="44" y="84" width="190" height="112" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="139" y="124" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1. WRITE</text>
  <text x="139" y="150" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Markdown + Astro</text>
  <text x="139" y="174" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">EN &amp; 中文 in Git</text>

  <!-- Arrow 1 -->
  <path d="M244 140 H292" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M285 133 L294 140 L285 147" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: GitHub -->
  <rect x="305" y="84" width="190" height="112" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="124" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2. PUSH</text>
  <text x="400" y="150" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">GitHub (main)</text>
  <text x="400" y="174" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Versioned &amp; Portable</text>

  <!-- Arrow 2 -->
  <path d="M505 140 H553" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M546 133 L555 140 L546 147" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Cloudflare Pages -->
  <rect x="566" y="84" width="190" height="112" rx="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="661" y="124" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3. DEPLOY</text>
  <text x="661" y="150" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Cloudflare Pages</text>
  <text x="661" y="174" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="12">albertlee.org Global CDN</text>

  <text x="400" y="232" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">Example image served from /images/static-blog-stack.svg</text>
